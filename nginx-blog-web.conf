# Replace the domains and static paths before enabling this configuration.
# The Spring Boot service listens on 127.0.0.1:8080 over HTTP.

server {
    listen 80;
    server_name farmertofarm.cloud;
    absolute_redirect off;

    root /www/wwwroot/blog-system/blog-web/dist;
    index index.html;
    client_max_body_size 205m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    location ~ ^/assets/[^/]+\.(js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = / { return 302 /blog/$is_args$args; }
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /blog { return 301 /blog/; }
    location /blog/ {
        try_files $uri $uri/ =404;
    }

    location /api/ai/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        return 404;
    }
}
