server {
    listen 80;
    server_name admin.jrtitan.xyz;
    return 301 https://admin.jrtitan.xyz$request_uri;
}

server {
    listen 443 ssl;
    server_name admin.jrtitan.xyz;
    # Shared *.jrtitan.xyz Origin CA certificate, already installed for blog.
    ssl_certificate /www/server/nginx/ssl/blog.jrtitan.xyz/public_ssl.pem;
    ssl_certificate_key /www/server/nginx/ssl/blog.jrtitan.xyz/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:blog_tls:10m;
    ssl_session_timeout 1d;
    client_max_body_size 205m;

    location ^~ /api/admin/media/uploads/ {
        proxy_pass http://127.0.0.1:5174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        client_max_body_size 205m;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
    }

    location / {
        proxy_pass http://127.0.0.1:5174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
