# Use this override on hosts where Docker blocks TCP between containers on a
# bridge network. Services share the host network and keep their normal ports.
services:
  redis:
    network_mode: host
    ports: !reset []

  blog-server:
    network_mode: host
    ports: !reset []
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PUBLICATION_BASE_URL: http://127.0.0.1:${BLOG_PUBLISHER_PORT:-8081}
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: ${BLOG_REDIS_PORT:-6380}

  blog-publisher:
    network_mode: host
    ports: !reset []
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BLOG_API_URL: http://127.0.0.1:${BLOG_SERVER_PORT:-8080}

  blog-web:
    network_mode: host
    ports: !reset []
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BACKEND_URL: http://127.0.0.1:${BLOG_SERVER_PORT:-8080}
      PUBLICATION_URL: http://127.0.0.1:${BLOG_PUBLISHER_PORT:-8081}
      NGINX_LISTEN_PORT: ${BLOG_HTTP_PORT:-80}
      NGINX_ENVSUBST_VARS: '$$BACKEND_URL $$PUBLICATION_URL $$NGINX_LISTEN_PORT'
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:${BLOG_HTTP_PORT:-80}/ || exit 1"]

  blog-admin:
    network_mode: host
    ports: !reset []
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BACKEND_URL: http://127.0.0.1:${BLOG_SERVER_PORT:-8080}
      NGINX_LISTEN_PORT: ${BLOG_ADMIN_PORT:-5174}
      NGINX_ENVSUBST_VARS: '$$BACKEND_URL $$NGINX_LISTEN_PORT'
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:${BLOG_ADMIN_PORT:-5174}/ || exit 1"]
