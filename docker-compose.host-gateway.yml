# Use this override on hosts where Docker blocks TCP between containers on a
# bridge network. Services keep their normal container ports, while the
# application reaches them through the host gateway.
services:
  redis:
    ports:
      - "${BLOG_REDIS_PORT:-6380}:6380"

  blog-server:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BLOG_SERVER_PORT:-8080}:8080"
    environment:
      PUBLICATION_BASE_URL: http://host.docker.internal:${BLOG_PUBLISHER_PORT:-8081}
      REDIS_HOST: host.docker.internal
      REDIS_PORT: ${BLOG_REDIS_PORT:-6380}

  blog-publisher:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BLOG_PUBLISHER_PORT:-8081}:8081"
    environment:
      BLOG_API_URL: http://host.docker.internal:${BLOG_SERVER_PORT:-8080}

  blog-web:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BACKEND_URL: http://host.docker.internal:${BLOG_SERVER_PORT:-8080}
      PUBLICATION_URL: http://host.docker.internal:${BLOG_PUBLISHER_PORT:-8081}

  blog-admin:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BACKEND_URL: http://host.docker.internal:${BLOG_SERVER_PORT:-8080}
