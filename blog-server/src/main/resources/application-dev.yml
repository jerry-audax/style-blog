spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:5432/blog_system}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:1}
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: qwen-max

publication:
  base-url: ${PUBLICATION_BASE_URL:http://127.0.0.1:5176}
  api-token: ${PUBLICATION_API_TOKEN:}
  token-file: ${PUBLICATION_TOKEN_FILE:../blog-web/.runtime/publication.key}

sa-token:
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET_KEY:${JWT_SECRET:}}
