spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/blog-system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:26739}
      password: ${REDIS_PASSWORD:}
      database: 0
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: qwen-max

springdoc:
  api-docs:
    enabled: false

sa-token:
  jwt-secret-key: ${JWT_SECRET:}

blog:
  upload:
    dir: /www/wwwroot/blog-system/blog-server/uploads
    public-url: http://47.88.48.16:8080
